name: publish

# 发版：打 tag（如 v0.1.2）后自动发布到 npm，走 OIDC 可信发布（不需要 token / 验证码）。
# 前置条件（已在 npm 站点配置）：
#   npmjs.com → 包 → Settings → Trusted Publisher → GitHub Actions
#   Repository: Hungry-M/dsh-deepseek-import
#   Workflow:   publish.yml
#   Allowed actions: Allow npm publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC，供 npm trusted publishing 使用
    steps:
      - uses: actions/checkout@v4

      # 可信发布需要 npm >= 11.5.1；Node 22 自带的是 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Tests
        run: |
          node verify/test-parser.mjs
          node verify/test-merge.mjs
          node verify/smoke.mjs

      - name: Publish
        run: npm publish --access public --provenance
