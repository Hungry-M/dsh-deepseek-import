name: Bug report
description: 报告导入失败、会话打不开、数据异常等问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请**不要**在这里发，走 [SECURITY.md](../blob/main/SECURITY.md)。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 运行 `npm ls -g dsh-deepseek-import` 或 `dsh-import --version`
      placeholder: 0.3.1
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 设置页可见，或从安装目录的 version 文件读取
      placeholder: 0.2.2-rc.1
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 抓取（Edge 扩展）
        - 导入（CLI / TUI）
        - 打开会话（历史加载失败 / 继续对话报错）
        - 工作区（权限、注册、迁移）
        - 插件（import_deepseek_chat）
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 命令、错误原文（完整贴出），以及你期望的结果
      render: text
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出
      description: 运行 `dsh-import --doctor` 并把输出贴在这里（不含对话内容）
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私
      options:
        - label: 我确认贴出的内容不含对话正文、token 或真实文件路径中的用户名
          required: true
